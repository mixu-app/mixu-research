name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: '**/*.md'

  corpus:
    name: Corpus manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Recompute public-domain status
        run: python3 tools/check_corpus.py

  no-book-text:
    name: No book text committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail on book payloads
        run: |
          set -euo pipefail
          # Binary book formats anywhere; .txt anywhere except licence and tool directories,
          # because LICENSES/Apache-2.0.txt is not a novel.
          binary=$(git ls-files | grep -Ei '\.(epub|mobi|azw3|pdf)$' || true)
          text=$(git ls-files '*.txt' | grep -Ev '^(LICENSES/|tools/)' || true)
          hits=$(printf '%s\n%s\n' "$binary" "$text" | sed '/^$/d')
          if [ -n "$hits" ]; then
            echo "Book payloads must never be committed:"; echo "$hits"; exit 1
          fi
          echo "no book payloads tracked"
